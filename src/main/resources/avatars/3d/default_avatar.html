<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Avatar Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #info { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #fff; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ammo.js@0.0.10/builds/ammo.wasm.js"></script>
    <script>
        // 初始化物理引擎
        Ammo().then(function(AmmoLib) {
            Ammo = AmmoLib;
            init();
        });

        let camera, scene, renderer, controls;
        let avatar, mixer;
        let clock = new THREE.Clock();
        
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a2a);
            
            // 创建环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            // 创建主光源
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(0, 10, 10);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            // 创建填充光源
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-10, 5, -10);
            scene.add(fillLight);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 5);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            
            // 创建控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.5, 0);
            controls.update();
            
            // 加载模型
            const loader = new THREE.GLTFLoader();
            loader.load('default_avatar.glb', function(gltf) {
                avatar = gltf.scene;
                scene.add(avatar);
                
                // 设置阴影
                avatar.traverse(function(node) {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                
                // 设置动画
                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(avatar);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
                
                // 自动调整相机距离
                const box = new THREE.Box3().setFromObject(avatar);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                
                controls.maxDistance = size * 10;
                camera.position.copy(center.clone().add(new THREE.Vector3(0, 0, size * 2)));
                controls.target.copy(center);
                controls.update();
            });
            
            // 创建地板
            const floorGeometry = new THREE.CircleGeometry(5, 32);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x404040 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // 窗口大小变化时调整
            window.addEventListener('resize', onWindowResize);
            
            // 开始动画循环
            animate();
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // 表情更新接口
        window.updateExpression = function(expression) {
            // 在这里根据表情更新模型
            console.log('Expression updated:', expression);
            
            if (avatar) {
                // 查找头部模型
                let head = null;
                avatar.traverse(function(node) {
                    if (node.isMesh && (node.name.includes('Head') || node.name.includes('Face'))) {
                        head = node;
                    }
                });
                
                if (head && head.morphTargetInfluences) {
                    // 清除现有表情
                    for (let i = 0; i < head.morphTargetInfluences.length; i++) {
                        head.morphTargetInfluences[i] = 0;
                    }
                    
                    // 应用新表情
                    if (expression === 'happy') {
                        // 查找笑脸morph target
                        for (let i = 0; i < head.morphTargetDictionary.length; i++) {
                            if (head.morphTargetDictionary[i].includes('smile') || 
                                head.morphTargetDictionary[i].includes('happy')) {
                                head.morphTargetInfluences[i] = 1.0;
                                break;
                            }
                        }
                    } else if (expression === 'sad') {
                        // 查找难过表情
                        for (let i = 0; i < head.morphTargetDictionary.length; i++) {
                            if (head.morphTargetDictionary[i].includes('sad') || 
                                head.morphTargetDictionary[i].includes('frown')) {
                                head.morphTargetInfluences[i] = 1.0;
                                break;
                            }
                        }
                    } else if (expression === 'thinking') {
                        // 查找思考表情
                        for (let i = 0; i < head.morphTargetDictionary.length; i++) {
                            if (head.morphTargetDictionary[i].includes('think') || 
                                head.morphTargetDictionary[i].includes('ponder')) {
                                head.morphTargetInfluences[i] = 1.0;
                                break;
                            }
                        }
                    }
                }
            }
        };
    </script>
</body>
</html>
