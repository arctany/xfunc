########################################################
# AI虚拟助手平台配置文件
########################################################

# 应用程序配置
spring.application.name=AI Virtual Assistant
server.port=8080

# AI服务配置
ai.api.url=https://api.openai.com/v1/chat/completions
ai.api.key=your_openai_api_key_here
ai.model.name=gpt-3.5-turbo
ai.model.temperature=0.7
ai.model.max-tokens=1000
ai.personality=你是一个友好、有帮助的AI助手。

# 日志配置
logging.level.root=INFO
logging.level.com.arctany.aivirtualassistant=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 资源目录配置
avatar.resources.path=src/main/resources/avatars
voice.resources.path=src/main/resources/voices
image.resources.path=src/main/resources/images

# 其他设置
spring.main.web-application-type=none 